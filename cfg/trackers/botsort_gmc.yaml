# BoT-SORT WITH camera-motion compensation, for the oracle control asked for in
# review: the platform is a moving UAV, so an associator without global motion
# compensation could be blamed for the over-count. Real frames are passed here.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
