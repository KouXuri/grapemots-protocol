# BoT-SORT with appearance re-identification, the "+ ReID" arm of Table IV.
# The encoder is Ultralytics' ImageNet-pretrained yolo11n-cls: it has never seen
# GrapeMOTS or any vineyard data, which is the point of the arm. Everything else
# matches the plain BoT-SORT arm.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: True
model: yolo11n-cls.pt
